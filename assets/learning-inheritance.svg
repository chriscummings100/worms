<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="#0B2027"/>
<circle cx="40" cy="55" r="3" fill="#315253"/>
<circle cx="1480" cy="84" r="3" fill="#315253"/>
<circle cx="1554" cy="392" r="3" fill="#315253"/>
<circle cx="31" cy="850" r="3" fill="#315253"/>
<circle cx="1440" cy="940" r="3" fill="#315253"/>
<circle cx="1510" cy="760" r="3" fill="#315253"/>
<text x="52.00" y="51.22" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A6FFCF">WORMS / LEARNING + INHERITANCE</text>
<text x="52.00" y="110.97" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" fill="#ECF8F2">Learn during life. Blend only at birth.</text>
<text x="52.00" y="156.96" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#A5C2BD">A delayed reward updates runtime weights; reproduction transfers genes through a separate mechanism.</text>
<text x="52.00" y="214.22" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A6FFCF">ONE FROZEN-POLICY WINDOW</text>
<rect x="52" y="242" width="542" height="166" rx="18" fill="#133038" stroke="#A6FFCF" stroke-width="2"/>
<text x="78.00" y="287.12" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#A6FFCF">01–32 / Record decisions</text>
<text x="78.00" y="330.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Save observations and sampled actions.</text>
<text x="78.00" y="365.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Accumulate their future energy returns.</text>
<rect x="626" y="242" width="542" height="166" rx="18" fill="#133038" stroke="#8D9AF0" stroke-width="2"/>
<text x="652.00" y="287.12" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#8D9AF0">33–64 / Future tail</text>
<text x="652.00" y="330.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Keep acting with the same weights.</text>
<text x="652.00" y="365.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Let the recorded rewards mature.</text>
<rect x="1200" y="242" width="348" height="166" rx="18" fill="#133038" stroke="#E99363" stroke-width="2"/>
<text x="1226.00" y="286.33" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#E99363">Then: one update</text>
<text x="1226.00" y="330.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Policy gradient from</text>
<text x="1226.00" y="365.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">the 32 recorded actions.</text>
<polyline points="598,324 620,324" fill="none" stroke="#A6FFCF" stroke-width="3" stroke-linejoin="round"/>
<polygon points="620.00,324.00 611.22,328.79 611.22,319.21" fill="#A6FFCF"/>
<polyline points="1172,324 1194,324" fill="none" stroke="#8D9AF0" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1194.00,324.00 1185.22,328.79 1185.22,319.21" fill="#8D9AF0"/>
<rect x="52" y="439" width="1496" height="76" rx="18" fill="#163B3C" stroke="#42716B" stroke-width="2"/>
<text x="79.00" y="479.96" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#A6FFCF">Reward looks forward:</text>
<text x="367.00" y="479.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#ECF8F2">integrate FUTURE energy; count zero after death. No gradients through feeding or combat.</text>
<text x="52.00" y="569.22" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A6FFCF">INHERITANCE / A BIRTH EVENT</text>
<rect x="52" y="600" width="402" height="119" rx="18" fill="#133038" stroke="#315253" stroke-width="2"/>
<text x="78.00" y="641.33" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#A6FFCF">Parent’s birth weights</text>
<text x="78.00" y="683.38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#A5C2BD">Immutable genetic starting point</text>
<rect x="52" y="758" width="402" height="119" rx="18" fill="#133038" stroke="#315253" stroke-width="2"/>
<text x="78.00" y="799.33" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#8D9AF0">Parent’s learned weights</text>
<text x="78.00" y="841.38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#A5C2BD">Current within-lifetime policy</text>
<rect x="551" y="647" width="422" height="182" rx="18" fill="#133038" stroke="#E99363" stroke-width="2"/>
<text x="578.00" y="693.12" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#E99363">Blend using α_parent</text>
<text x="578.00" y="738.54" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#ECF8F2">(1 − α) · birth + α · learned</text>
<text x="578.00" y="788.17" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#A5C2BD">Then mutate weights and genes.</text>
<polyline points="458,660 500,660 500,700 545,700" fill="none" stroke="#A6FFCF" stroke-width="3" stroke-linejoin="round"/>
<polygon points="545.00,700.00 536.22,704.79 536.22,695.21" fill="#A6FFCF"/>
<polyline points="458,817 500,817 500,776 545,776" fill="none" stroke="#8D9AF0" stroke-width="3" stroke-linejoin="round"/>
<polygon points="545.00,776.00 536.22,780.79 536.22,771.21" fill="#8D9AF0"/>
<polyline points="979,738 1040,738" fill="none" stroke="#E99363" stroke-width="3" stroke-linejoin="round"/>
<polygon points="1040.00,738.00 1031.22,742.79 1031.22,733.21" fill="#E99363"/>
<rect x="1046" y="621" width="502" height="234" rx="18" fill="#133038" stroke="#A6FFCF" stroke-width="2"/>
<text x="1073.00" y="667.91" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#A6FFCF">Child starts a new life</text>
<text x="1073.00" y="714.96" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#A5C2BD">New immutable birth weights</text>
<text x="1073.00" y="755.96" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#A5C2BD">Fresh runtime copy of those weights</text>
<text x="1073.00" y="796.96" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#A5C2BD">Reset history, tape and optimizer</text>
<text x="52.00" y="973.22" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#A5C2BD">The blending factor can evolve. Selection chooses successful lineages; gradients adjust an individual’s policy.</text>
</svg>