[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "worms"
version = "0.1.0"
description = "A small artificial ecosystem built with Python and SlangPy"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "slangpy==0.43.1",
    "numpy>=2,<3",
    "pillow>=12,<14",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.17,<0.18"]

[project.scripts]
worms-render = "worms.render:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worms = ["shaders/*.slang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = ["gpu: requires a real GPU and SlangPy graphics backend (opt in with --run-gpu)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
